spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/online_store
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        show_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

app:
  security:
    jwt:
      secret: change-me
      issuer: online-store
      expirationMinutes: 60
